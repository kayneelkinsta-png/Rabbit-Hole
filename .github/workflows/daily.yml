name: daily routes

# Keeps the next two weeks of "today's challenge" routes (daily/<date>.json) filled in, so everyone gets the same one.
# Runs every night, and can be run by hand from the Actions tab (Run workflow).
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'How many days ahead to fill'
        default: '14'

permissions:
  contents: write

jobs:
  routes:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Build the missing routes
        env:
          DAYS: ${{ github.event.inputs.days || '14' }}
          PYTHON: python3
        run: node tools/make_daily_ci.mjs
      - name: Commit the new routes
        run: |
          git config user.name "daily-routes"
          git config user.email "actions@users.noreply.github.com"
          git add daily
          if git diff --cached --quiet; then echo "no new routes"; else git commit -m "Daily routes: $(date -u +%F)" && git push; fi
