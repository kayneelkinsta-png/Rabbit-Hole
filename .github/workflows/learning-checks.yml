name: Learning route checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lesson-model:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Validate lesson sharing and journal boundaries
        run: node --test tests/*.test.mjs
      - name: Check interface syntax
        run: node --check learning/app.mjs
